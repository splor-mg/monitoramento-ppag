[project]
name = "monitoramento-ppag"
version = "0.1.0"
description = "Rotinas para tratamento, análise e geração de produtos do monitoramento do PPAG de Minas Gerais."
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "requests>=2.32",
    "pyarrow>=17.0",
    "xlrd (>=2.0.2)",
    "geopandas (>=1.1)",
    "matplotlib (>=3.10)",
    "python-docx (>=1.2)",
]

[tool.poetry]
package-mode = false